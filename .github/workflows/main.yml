name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build 3105
        run: |
          rm -rf build Payload

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build

      - name: Make IPA
        run: |
          mkdir -p Payload
          cp -R "build/3105.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload 3105-show-hidden-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-show-hidden-unsigned
          path: 3105-show-hidden-unsigned.ipa
          if-no-files-found: error
