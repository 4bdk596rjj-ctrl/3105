name: Build IPA FILE
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme OGIOS -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath build
          mkdir -p Payload
          APP=$(find build -name "*.app" | head -1)
          echo "App found: $APP"
          cp -R "$APP" Payload/
          zip -r OGIOS-File.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OGIOS-File-ipa
          path: OGIOS-File.ipa
