name: Build IPA FILE
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: List schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj
      - name: Build IPA
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme ThreeOneOSFive -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build || xcodebuild -project ThreeOneOSFive.xcodeproj -alltargets -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/ || cp -R build/Build/Products/Release-iphoneos/Release/*.app Payload/
          ls Payload
          zip -r OGIOS-file.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OGIOS-file-ipa
          path: OGIOS-file.ipa
