workflows:
  ios-unsigned:
    name: Build 3105 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build IPA
        script: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme ThreeOneOSFive -configuration Release -sdk iphoneos -archivePath build/ThreeOneOSFive.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ipa/Payload
          cp -r build/ThreeOneOSFive.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa && zip -r ../../ThreeOneOSFive-unsigned.ipa Payload
    artifacts:
      - ./*.ipa
